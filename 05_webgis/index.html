<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web GIS Rekomendasi Tanaman – Malang Raya</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- CSS kita sendiri -->
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- Judul -->
  <div id="header">
    <h1>🌾 Rekomendasi Tanaman Berbasis Kesesuaian Lahan</h1>
    <p>Klik desa/kelurahan untuk melihat ranking tanaman</p>
  </div>

  <!-- Container peta -->
  <div id="map"></div>

  <!-- Panel info (muncul saat klik) -->
  <div id="info-panel">
    <div id="info-content">
      <p style="color: #888; font-style: italic;">Klik desa untuk melihat rekomendasi</p>
    </div>
  </div>

  <!-- Legenda -->
  <div id="legend">
    <strong>Skor SAW</strong>
    <div><span class="leg-color" style="background:#1a9641"></span> Tinggi (≥ 0.70)</div>
    <div><span class="leg-color" style="background:#a6d96a"></span> Sedang (0.50–0.69)</div>
    <div><span class="leg-color" style="background:#fdae61"></span> Cukup (0.30–0.49)</div>
    <div><span class="leg-color" style="background:#d7191c"></span> Rendah (< 0.30)</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App kita -->
  <script src="js/app.js"></script>

</body>
</html>
